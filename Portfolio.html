<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nanjing Portfolio · Dark Gold Edition</title>
  <style>
    /* --- Reset & Base --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #1a1a2e, #0f0f1a 70%);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      color: #e2e8f0;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        radial-gradient(2px 2px at 20% 30%, rgba(212, 175, 55, 0.15), transparent),
        radial-gradient(2px 2px at 40% 70%, rgba(212, 175, 55, 0.1), transparent),
        radial-gradient(1px 1px at 70% 20%, rgba(212, 175, 55, 0.2), transparent),
        radial-gradient(1px 1px at 90% 80%, rgba(212, 175, 55, 0.1), transparent),
        radial-gradient(1px 1px at 10% 90%, rgba(212, 175, 55, 0.15), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* ===== BACK BUTTON ===== */
    .back-home {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #e4c988;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 8px 16px;
        border: 2px solid #e4c988;
        border-radius: 8px;
        transition: 0.2s;
        margin-bottom: 12px;
        background: transparent;
    }
    .back-home:hover {
        background: #e4c988;
        color: #12181a;
    }

    /* --- Header Mewah dengan Logo --- */
    .page-header {
      text-align: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      position: relative;
    }

    .page-header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 25%;
      right: 25%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
    }

    .header-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .header-logo img {
      height: 64px;
      width: auto;
      filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.3));
      transition: transform 0.3s ease;
      border-radius: 8px;
    }

    .header-logo img:hover {
      transform: scale(1.05);
    }

    .header-logo .logo-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #d4af37;
      letter-spacing: 0.1em;
      text-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
    }

    .header-logo .logo-divider {
      width: 2px;
      height: 40px;
      background: linear-gradient(180deg, transparent, #d4af37, transparent);
      opacity: 0.3;
    }

    .page-header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #f9e07f, #d4af37, #b8860b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
      display: inline-block;
      margin-top: 0;
    }

    .page-header .subtitle {
      display: block;
      font-size: 1rem;
      font-weight: 300;
      color: #94a3b8;
      margin-top: 0.3rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .badge-count {
      display: inline-block;
      background: rgba(212, 175, 55, 0.15);
      color: #d4af37;
      padding: 0.3rem 1.5rem;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.5rem;
      border: 1px solid rgba(212, 175, 55, 0.2);
      backdrop-filter: blur(10px);
    }

    /* --- Filter & Search Controls --- */
    .filter-controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 1.5rem;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
    }

    .filter-row .label {
      color: #94a3b8;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    /* --- Search Box --- */
    .search-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 8px;
      padding: 6px 14px;
      flex: 1;
      min-width: 200px;
      transition: border-color 0.2s;
    }
    .search-box:focus-within {
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }
    .search-box input {
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-size: 0.9rem;
      padding: 8px 0;
      width: 100%;
      outline: none;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .search-box input::placeholder {
      color: #64748b;
    }
    .search-box .icon {
      color: #64748b;
      margin-right: 8px;
      font-size: 0.9rem;
    }

    /* --- Category Chips --- */
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      padding: 5px 14px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.15);
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chip:hover {
      border-color: rgba(212, 175, 55, 0.4);
      color: #e2e8f0;
    }
    .chip.active {
      background: rgba(212, 175, 55, 0.15);
      border-color: #d4af37;
      color: #f9e07f;
    }
    .chip.active-lowrisk {
      background: rgba(74, 222, 128, 0.15);
      border-color: #4ade80;
      color: #4ade80;
    }
    .chip.active-highrisk {
      background: rgba(248, 113, 113, 0.15);
      border-color: #f87171;
      color: #f87171;
    }
    .chip.active-forward {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* --- Slider with Switch --- */
    .slider-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      padding-top: 8px;
      border-top: 1px solid rgba(212, 175, 55, 0.05);
    }
    .slider-item {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 180px;
    }
    .slider-item .switch-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .slider-item .switch-track {
      width: 36px;
      height: 20px;
      background: #334155;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      transition: background 0.25s ease;
      flex-shrink: 0;
    }
    .slider-item .switch-track.on {
      background: #d4af37;
    }
    .slider-item .switch-track .thumb {
      width: 16px;
      height: 16px;
      background: #f1f5f9;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.25s ease;
    }
    .slider-item .switch-track.on .thumb {
      transform: translateX(16px);
    }
    .slider-item .slider-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 80px;
    }
    .slider-item .slider-body .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #94a3b8;
    }
    .slider-item .slider-body .slider-header .slider-label {
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .slider-item .slider-body .slider-header .slider-value {
      color: #f9e07f;
      font-weight: 600;
    }
    .slider-item .slider-body input[type="range"] {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(212, 175, 55, 0.2);
      border-radius: 4px;
      outline: none;
      transition: background 0.2s, opacity 0.25s;
    }
    .slider-item .slider-body input[type="range"]:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .slider-item .slider-body input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #d4af37;
      cursor: pointer;
      border: 2px solid #0f0f1a;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }
    .slider-item .slider-body input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #d4af37;
      cursor: pointer;
      border: 2px solid #0f0f1a;
    }
    .slider-item .slider-body input[type="range"]:focus {
      background: rgba(212, 175, 55, 0.35);
    }
    .slider-item .slider-body input[type="range"]:disabled::-webkit-slider-thumb {
      background: #475569;
      cursor: not-allowed;
    }
    .slider-item .slider-body input[type="range"]:disabled::-moz-range-thumb {
      background: #475569;
      cursor: not-allowed;
    }

    /* --- Reset & Result Count --- */
    .filter-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 16px;
      padding-top: 8px;
      border-top: 1px solid rgba(212, 175, 55, 0.05);
    }
    .filter-actions .result-count {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .filter-actions .result-count strong {
      color: #f9e07f;
    }
    .btn-reset {
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .btn-reset:hover {
      border-color: #f87171;
      color: #f87171;
      background: rgba(248, 113, 113, 0.08);
    }

    /* --- Sorting Controls (existing) --- */
    .sort-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 14px;
      padding: 12px 20px;
      margin-bottom: 1.5rem;
    }

    .sort-controls .label {
      color: #94a3b8;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      margin-right: 4px;
    }

    .sort-controls select,
    .sort-controls button {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 8px;
      padding: 6px 12px;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .sort-controls select:hover,
    .sort-controls button:hover {
      border-color: rgba(212, 175, 55, 0.5);
      background: rgba(212, 175, 55, 0.08);
    }

    .sort-controls select:focus,
    .sort-controls button:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }

    .sort-controls select option {
      background: #1a1a2e;
      color: #e2e8f0;
    }

    .sort-controls .sort-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sort-controls .order-btn {
      padding: 6px 10px;
      min-width: 36px;
      text-align: center;
      font-weight: 600;
    }

    .sort-controls .order-btn.active {
      border-color: #d4af37;
      background: rgba(212, 175, 55, 0.15);
      color: #f9e07f;
    }

    /* --- Grid Kartu --- */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      margin-top: 0.5rem;
    }

    .portfolio-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 1.8rem 1.5rem 1.5rem;
      border: 1px solid rgba(212, 175, 55, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(212, 175, 55, 0.1);
      transition: transform 0.3s ease, box-shadow 0.4s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
      position: relative;
      overflow: hidden;
    }

    .portfolio-card.reordering {
      animation: none;
      opacity: 1;
    }

    .portfolio-card.hidden {
      display: none;
    }

    .portfolio-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(212, 175, 55, 0.03), transparent 60%);
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .portfolio-card:hover {
      transform: translateY(-8px);
      border-color: rgba(212, 175, 55, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 175, 55, 0.05), inset 0 1px 0 rgba(212, 175, 55, 0.2);
    }

    .portfolio-card:hover::before {
      opacity: 0.5;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* --- Isi Kartu --- */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.8rem;
      position: relative;
      z-index: 1;
    }

    .card-number {
      font-size: 0.7rem;
      font-weight: 700;
      color: #d4af37;
      letter-spacing: 0.5px;
      background: rgba(212, 175, 55, 0.1);
      padding: 0.15rem 0.8rem;
      border-radius: 30px;
      border: 1px solid rgba(212, 175, 55, 0.15);
    }

    .status-badge {
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      letter-spacing: 0.3px;
    }

    .status-active {
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.2);
    }
    .status-dev {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.2);
    }
    .status-archived {
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0.4rem 0 0.2rem;
      color: #f1f5f9;
      line-height: 1.3;
      position: relative;
      z-index: 1;
      letter-spacing: 0.02em;
    }

    /* --- Backtest Stats --- */
    .card-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 1rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.8rem 1rem;
      border-radius: 14px;
      margin: 0.6rem 0 0.6rem;
      font-size: 0.8rem;
      border: 1px solid rgba(212, 175, 55, 0.05);
      position: relative;
      z-index: 1;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
    }
    .stat-label {
      color: #94a3b8;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-value {
      font-weight: 600;
      color: #f9e07f;
      font-size: 0.85rem;
    }

    /* --- Forward Test Stats --- */
    .forward-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.4rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
      margin: 0.2rem 0 0.8rem;
      font-size: 0.7rem;
      border: 1px solid rgba(212, 175, 55, 0.08);
      position: relative;
      z-index: 1;
    }

    .forward-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .forward-label {
      color: #94a3b8;
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .forward-value {
      font-weight: 600;
      font-size: 0.75rem;
      margin-top: 1px;
    }
    .forward-value.positive { color: #4ade80; }
    .forward-value.negative { color: #f87171; }
    .forward-value.neutral { color: #94a3b8; }

    .forward-update {
      font-size: 0.55rem;
      color: #64748b;
      text-align: right;
      margin-top: 2px;
      position: relative;
      z-index: 1;
    }

    .card-updated {
      font-size: 0.7rem;
      color: #64748b;
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 1;
    }

    .card-link {
      display: inline-block;
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: #0f0f1a;
      text-decoration: none;
      padding: 0.6rem 1.5rem;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.85rem;
      text-align: center;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      align-self: flex-start;
      margin-top: 0.2rem;
      position: relative;
      z-index: 1;
      letter-spacing: 0.03em;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
    }

    .card-link:hover {
      transform: scale(0.97);
      box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
      background: linear-gradient(135deg, #f9e07f, #d4af37);
    }

    /* --- Empty State --- */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border-radius: 40px;
      border: 1px solid rgba(212, 175, 55, 0.1);
      color: #94a3b8;
    }

    .empty-state h3 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #d4af37;
    }

    /* --- Footer --- */
    .page-footer {
      margin-top: 4rem;
      text-align: center;
      font-size: 0.85rem;
      color: #475569;
      border-top: 1px solid rgba(212, 175, 55, 0.1);
      padding-top: 2rem;
      position: relative;
    }

    .page-footer a {
      color: #d4af37;
      text-decoration: none;
      transition: color 0.2s;
    }

    .page-footer a:hover {
      color: #f9e07f;
      text-decoration: underline;
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .filter-row {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box {
        flex: unset;
        width: 100%;
      }
      .slider-group {
        flex-direction: column;
      }
      .slider-item {
        min-width: unset;
      }
      .sort-controls {
        flex-direction: column;
        align-items: stretch;
      }
      .sort-controls .sort-group {
        justify-content: space-between;
      }
      .forward-stats {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 480px) {
      body { padding: 1rem; }
      .page-header h1 { font-size: 2rem; }
      .portfolio-grid { gap: 1.2rem; }
      .card-stats { grid-template-columns: 1fr; }
      .portfolio-card { padding: 1.2rem; }
      .header-logo img { height: 40px; }
      .header-logo .logo-text { font-size: 1.2rem; }
      .header-logo .logo-divider { height: 24px; }
      .forward-stats {
        grid-template-columns: 1fr 1fr;
        gap: 0.3rem;
        padding: 0.5rem;
      }
      .forward-value { font-size: 0.7rem; }
      .filter-controls { padding: 12px 14px; }
      .slider-item {
        flex-wrap: wrap;
      }
      .slider-item .slider-body {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- ============================================================
         BACK BUTTON
         ============================================================ -->
    <a href="index.html" class="back-home">← Kembali ke Beranda</a>

    <!-- ============================================================
         HEADER DENGAN LOGO
         ============================================================ -->
    <header class="page-header">
      <div class="header-logo">
         <img src="nanjing-ico1.png" alt="Nanjing Logo" onerror="this.style.display='none'">
        <span class="logo-divider"></span>
        <span class="logo-text">✦ Nanjing Investasi ✦</span>
      </div>
      <h1>✦ Portfolio Gallery ✦</h1>
      <span class="subtitle">Trading System &amp; Strategy Gallery</span>
      <div class="badge-count" id="portfolioCount">Memuat...</div>
    </header>

    <!-- ============================================================
         FILTER CONTROLS
         ============================================================ -->
    <div class="filter-controls" id="filterControls">

      <!-- Row 1: Search + Category Chips -->
      <div class="filter-row">
        <div class="search-box">
          <span class="icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Cari portofolio...">
        </div>
        <div class="chip-group">
          <span class="chip" data-filter="all" id="filterAll">All</span>
          <span class="chip active active-lowrisk" data-filter="lowrisk" id="filterLowRisk">🟢 Low Risk</span>
          <span class="chip" data-filter="highrisk" id="filterHighRisk">🔴 High Risk</span>
          <span class="chip" data-filter="forward" id="filterForward">📈 Forward Positive</span>
        </div>
      </div>

      <!-- Row 2: Result Count + Reset -->
      <div class="filter-actions">
        <span class="result-count" id="resultCount">Menampilkan <strong>0</strong> dari <strong>0</strong> portofolio</span>
        <button class="btn-reset" id="resetFiltersBtn">↺ Reset Semua Filter</button>
      </div>
    </div>

    <!-- ============================================================
         SORTING CONTROLS
         ============================================================ -->
    <div class="sort-controls" id="sortControls">
      <span class="label">Sort by</span>

      <div class="sort-group">
        <select id="sortField">
          <option value="name" selected>Name</option>
          <option value="return">Backtest Return</option>
          <option value="forwardGain">Forward Gain</option>
          <option value="forwardPF">Forward PF</option>
        </select>

        <button class="order-btn active" id="orderAsc" data-order="asc">↑</button>
        <button class="order-btn" id="orderDesc" data-order="desc">↓</button>
      </div>

      <button class="btn-reset" id="resetSortBtn" style="margin-left:auto;">↺ Reset Sort</button>
    </div>

    <!-- GRID PORTFOLIO -->
    <div class="portfolio-grid" id="portfolioGrid">
      <!-- Kartu akan di-generate oleh JavaScript -->
    </div>

    <!-- FOOTER -->
    <footer class="page-footer">
      <p>
        <a href="index.html">← Kembali ke Beranda</a>
        &nbsp;·&nbsp;
        <span id="yearFooter"></span> Nanjing Investasi
      </p>
    </footer>

  </div>

  <script>
    // ============================================================
    // 1. DATA PORTOFOLIO (loaded from JSON)
    // ============================================================
    let portfoliosData = [];

    // ============================================================
    // 2. VARIABEL & FUNGSI SORTING
    // ============================================================
    let currentOrder = 'asc';
    let currentField = 'name';
    let forwardData = {};
    let filteredPortfolios = [];

    function parsePercentage(str) {
      if (!str) return 0;
      return parseFloat(str.replace(/[+,%]/g, '').replace(/,/g, '')) || 0;
    }

    function getSortValue(portfolio, field) {
      const fwd = forwardData[portfolio.key] || {};
      switch (field) {
        case 'name': return portfolio.title.toLowerCase();
        case 'return': return parsePercentage(portfolio.backtestReturn);
        case 'forwardGain': return parsePercentage(fwd.gain);
        case 'forwardPF': return parseFloat(fwd.profitFactor) || 0;
        default: return 0;
      }
    }

    function sortPortfolios(portfolios, field, order) {
      const sorted = [...portfolios];
      sorted.sort((a, b) => {
        let valA = getSortValue(a, field);
        let valB = getSortValue(b, field);
        if (field === 'name') {
          return order === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
        }
        return order === 'asc' ? valA - valB : valB - valA;
      });
      return sorted;
    }

    // ============================================================
    // 3. FUNGSI FILTER
    // ============================================================
    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
      const activeChip = document.querySelector('.chip.active');
      const filterType = activeChip ? activeChip.dataset.filter : 'all';

      filteredPortfolios = portfoliosData.filter(p => {
        if (searchTerm && !p.title.toLowerCase().includes(searchTerm)) return false;

        const fwd = forwardData[p.key] || {};
        const fGain = parsePercentage(fwd.gain);

        if (filterType === 'forward' && fGain <= 0) return false;

        return true;
      });

      // Update result count
      document.getElementById('resultCount').innerHTML =
        `Menampilkan <strong>${filteredPortfolios.length}</strong> dari <strong>${portfoliosData.length}</strong> portofolio`;

      // Render
      const sorted = sortPortfolios(filteredPortfolios, currentField, currentOrder);
      renderPortfolios(sorted);
    }

    // ============================================================
    // 5. FUNGSI RENDER KARTU
    // ============================================================
    function renderPortfolios(portfolios) {
      const grid = document.getElementById('portfolioGrid');
      const countBadge = document.getElementById('portfolioCount');

      countBadge.textContent = `${portfolios.length} Portofolio`;

      if (portfolios.length === 0) {
        grid.innerHTML = `<div class="empty-state"><h3>✦ Tidak ada portofolio ✦</h3><p>Coba ubah filter atau pencarian Anda.</p></div>`;
        return;
      }

      let cardsHTML = '';
      portfolios.forEach((p, index) => {
        const fwd = forwardData[p.key] || {};

        let statusClass = 'status-active';
        let statusText = 'Aktif';
        if (p.status === 'dev') { statusClass = 'status-dev'; statusText = 'Pengembangan'; }
        else if (p.status === 'archived') { statusClass = 'status-archived'; statusText = 'Arsip'; }

        const filePath = `porto/${p.key}`;

        const returnVal = p.backtestReturn || '—';
        const gain = fwd.gain || '0.00%';
        const profit = fwd.profit || '$0.00';
        const drawdown = fwd.drawdown || '0.00%';
        const fwdWinRate = fwd.winRate || '0%';
        const fwdPF = fwd.profitFactor || '0.00';
        const balance = fwd.balance || '$0.00';

        let gainClass = 'neutral';
        const gainNum = parsePercentage(gain);
        if (gainNum > 0) gainClass = 'positive';
        else if (gainNum < 0) gainClass = 'negative';

        cardsHTML += `
          <div class="portfolio-card reordering" style="animation-delay: ${Math.min(index * 0.03, 0.5)}s">
            <div class="card-header">
              <span class="card-number">#${String(p.id).padStart(2, '0')}</span>
              <span class="status-badge ${statusClass}">${statusText}</span>
            </div>
            <h3 class="card-title">${p.title}</h3>

            <div class="card-stats">
              <div class="stat-item"><span class="stat-label">Return</span><span class="stat-value">${returnVal}</span></div>
              <div class="stat-item"><span class="stat-label">Win Rate</span><span class="stat-value">${p.winRate}</span></div>
              <div class="stat-item"><span class="stat-label">Max DD</span><span class="stat-value">${p.maxDD}</span></div>
              <div class="stat-item"><span class="stat-label">Profit Factor</span><span class="stat-value">${p.profitFactor}</span></div>
            </div>

            <div class="forward-stats">
              <div class="forward-item">
                <span class="forward-label">Gain</span>
                <span class="forward-value ${gainClass}">${gain}</span>
              </div>
              <div class="forward-item">
                <span class="forward-label">Profit</span>
                <span class="forward-value">${profit}</span>
              </div>
              <div class="forward-item">
                <span class="forward-label">Drawdown</span>
                <span class="forward-value">${drawdown}</span>
              </div>
              <div class="forward-item">
                <span class="forward-label">Win Rate</span>
                <span class="forward-value">${fwdWinRate}</span>
              </div>
              <div class="forward-item">
                <span class="forward-label">Profit Factor</span>
                <span class="forward-value">${fwdPF}</span>
              </div>
              <div class="forward-item">
                <span class="forward-label">Balance</span>
                <span class="forward-value">${balance}</span>
              </div>
            </div>
            <a href="${filePath}" target="_blank" class="card-link">✦ Lihat Detail</a>
          </div>
        `;
      });

      grid.innerHTML = cardsHTML;
    }

    function updateSortAndRender() {
      const sorted = sortPortfolios(filteredPortfolios.length ? filteredPortfolios : portfoliosData, currentField, currentOrder);
      renderPortfolios(sorted);
      updateButtonStates();
    }

    function updateButtonStates() {
      document.getElementById('orderAsc').classList.toggle('active', currentOrder === 'asc');
      document.getElementById('orderDesc').classList.toggle('active', currentOrder === 'desc');
    }

    // ============================================================
    // 6. LOAD DATA FROM JSON FILES
    // ============================================================
    async function loadPortfolioData() {
      try {
        const response = await fetch('portfolio-data.json');
        if (!response.ok) throw new Error('File tidak ditemukan');
        portfoliosData = await response.json();
        console.log('✅ Portfolio data dimuat:', portfoliosData.length, 'portofolio');
      } catch (error) {
        console.warn('⚠️ Gagal memuat portfolio-data.json:', error.message);
        portfoliosData = [];
      }
      applyFilters();
    }

    async function loadForwardData() {
      try {
        const response = await fetch('forward-test.json');
        if (!response.ok) throw new Error('File JSON tidak ditemukan');
        forwardData = await response.json();
        console.log('✅ Data Forward Test dimuat:', Object.keys(forwardData).length, 'portofolio');
      } catch (error) {
        console.warn('⚠️ Gagal memuat forward-test.json:', error.message);
        forwardData = {};
      }
      loadPortfolioData();
    }

    // ============================================================
    // 7. EVENT LISTENERS
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      // Set default sort: Name ASC
      document.getElementById('sortField').value = 'name';
      currentField = 'name';
      currentOrder = 'asc';
      updateButtonStates();

      // Load data
      loadForwardData();
      document.getElementById('yearFooter').textContent = new Date().getFullYear();
    });

    // --- Search ---
    document.getElementById('searchInput').addEventListener('input', applyFilters);

    // --- Category Chips ---
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', function() {
        document.querySelectorAll('.chip').forEach(c => {
          c.classList.remove('active', 'active-lowrisk', 'active-highrisk', 'active-forward');
        });
        this.classList.add('active');
        if (this.dataset.filter === 'lowrisk') this.classList.add('active-lowrisk');
        else if (this.dataset.filter === 'highrisk') this.classList.add('active-highrisk');
        else if (this.dataset.filter === 'forward') this.classList.add('active-forward');
        applyFilters();
      });
    });

    // --- Reset Filters ---
    document.getElementById('resetFiltersBtn').addEventListener('click', function() {
      document.getElementById('searchInput').value = '';
      document.querySelectorAll('.chip').forEach(c => {
        c.classList.remove('active', 'active-lowrisk', 'active-highrisk', 'active-forward');
      });
      document.getElementById('filterLowRisk').classList.add('active', 'active-lowrisk');
      currentField = 'name';
      currentOrder = 'asc';
      document.getElementById('sortField').value = 'name';
      updateButtonStates();
      applyFilters();
    });

    // --- Sorting ---
    document.getElementById('sortField').addEventListener('change', function() {
      currentField = this.value;
      applyFilters();
    });

    document.getElementById('orderAsc').addEventListener('click', function() {
      currentOrder = 'asc';
      applyFilters();
    });

    document.getElementById('orderDesc').addEventListener('click', function() {
      currentOrder = 'desc';
      applyFilters();
    });

    document.getElementById('resetSortBtn').addEventListener('click', function() {
      currentField = 'name';
      currentOrder = 'asc';
      document.getElementById('sortField').value = 'name';
      updateButtonStates();
      applyFilters();
    });
  </script>
</body>
</html>
