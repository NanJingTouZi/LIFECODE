<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Nanjing Investment</title>
    <script>
        window.CACHE_VERSION = 'v=' + Date.now();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a1a2b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        .splash-container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .splash-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            margin-bottom: 30px;
        }

        .btn-lanjut {
            background: linear-gradient(135deg, #f5c842, #dba62b);
            border: none;
            border-radius: 50px;
            padding: 16px 60px;
            font-size: 20px;
            font-weight: 700;
            color: #0a1a2b;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 0 #a07a1e, 0 10px 30px rgba(245, 200, 66, 0.3);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-lanjut:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #a07a1e, 0 15px 40px rgba(245, 200, 66, 0.4);
        }

        .btn-lanjut:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #a07a1e;
        }

        .countdown-badge {
            display: none;
        }

        .timer-info {
            color: #7e9bb5;
            font-size: 13px;
            margin-top: 16px;
            opacity: 0.7;
        }

        .timer-info span {
            color: #f5c842;
            font-weight: 600;
        }

        .install-banner {
            background: linear-gradient(135deg, #1a2f44, #0d1f30);
            border: 1px solid #f5c842;
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 8px 30px rgba(245, 200, 66, 0.1);
            animation: slideUp 0.5s ease;
        }

        .install-banner.show {
            display: flex;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .install-banner .icon-text {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #e8edf3;
        }

        .install-banner .icon-text .icon {
            font-size: 28px;
            background: #f5c842;
            color: #0a1a2b;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: 700;
        }

        .install-banner .icon-text .text {
            text-align: left;
        }

        .install-banner .icon-text .text strong {
            color: #f5c842;
            display: block;
            font-size: 15px;
        }

        .install-banner .icon-text .text small {
            font-size: 12px;
            color: #7e9bb5;
        }

        .btn-install {
            background: #f5c842;
            border: none;
            border-radius: 30px;
            padding: 10px 28px;
            font-weight: 700;
            font-size: 14px;
            color: #0a1a2b;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(245, 200, 66, 0.3);
            flex-shrink: 0;
        }

        .btn-install:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(245, 200, 66, 0.5);
        }

        .btn-install:active {
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            .btn-lanjut {
                padding: 14px 40px;
                font-size: 17px;
                width: 100%;
            }

            .install-banner {
                flex-direction: column;
                text-align: center;
                padding: 16px;
            }

            .install-banner .icon-text {
                flex-direction: column;
                text-align: center;
            }

            .install-banner .icon-text .text {
                text-align: center;
            }

            .btn-install {
                width: 100%;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <img 
            src="" 
            alt="Nanjing Investment" 
            class="splash-image"
            id="splashImage"
        />

        <button class="btn-lanjut" id="btnLanjut">
            Lanjutkan →
        </button>

        <div class="timer-info">
            ⏱️ Akan muncul kembali jika <span>1 jam</span> tidak mengunjungi aplikasi
        </div>

        <div class="install-banner" id="installBanner">
            <div class="icon-text">
                <div class="icon">📲</div>
                <div class="text">
                    <strong>Install Aplikasi Nanjing</strong>
                    <small>Pasang untuk akses lebih cepat &amp; pengalaman terbaik</small>
                </div>
            </div>
            <button class="btn-install" id="btnInstall">Install Sekarang</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. KONFIGURASI
        // ============================================================
        const TARGET_URL = 'https://nanjingtouzi.github.io/LIFECODE/menu.html';
        const ONE_HOUR = 60 * 60 * 1000;
        const STORAGE_KEY = 'nanjing_last_visit_lifecode';
        const INSTALL_KEY = 'nanjing_app_installed';
        const SESSION_KEY = 'nanjing_just_from_menu';

        // ============================================================
        // 1.5. AUTO-DETECT & ROTATE IMAGES
        // ============================================================
        const MAX_IMAGES = 10;
        let nanjingImages = [];
        let currentImageIndex = 0;

        function detectImages() {
            return new Promise((resolve) => {
                let loaded = 0;
                let totalChecked = 0;
                const cacheBust = window.CACHE_VERSION || 'v=' + Date.now();

                for (let i = 1; i <= MAX_IMAGES; i++) {
                    const img = new Image();
                    const src = `nanjing${i}.jpeg`;

                    img.onload = function() {
                        nanjingImages.push(src + '?' + cacheBust);
                        loaded++;
                        checkDone();
                    };

                    img.onerror = function() {
                        checkDone();
                    };

                    img.src = src + '?' + cacheBust;
                }

                function checkDone() {
                    totalChecked++;
                    if (totalChecked === MAX_IMAGES) {
                        if (nanjingImages.length === 0) {
                            nanjingImages.push('nanjing1.jpeg');
                        }
                        resolve();
                    }
                }
            });
        }

        function rotateImage() {
            if (nanjingImages.length <= 1) return;
            currentImageIndex = (currentImageIndex + 1) % nanjingImages.length;
            const imgEl = document.getElementById('splashImage');
            imgEl.style.opacity = '0';
            setTimeout(function() {
                imgEl.src = nanjingImages[currentImageIndex];
                imgEl.style.opacity = '1';
            }, 300);
        }

        function startImageRotation() {
            detectImages().then(function() {
                const imgEl = document.getElementById('splashImage');
                currentImageIndex = Math.floor(Math.random() * nanjingImages.length);
                imgEl.src = nanjingImages[currentImageIndex];
                imgEl.style.transition = 'opacity 0.3s ease';
                if (nanjingImages.length > 1) {
                    setInterval(rotateImage, 4000);
                }
            });
        }

        // ============================================================
        // 1.6. COUNTDOWN 5 DETIK
        // ============================================================
        function startCountdown() {
            let countdown = 5;
            const btn = document.getElementById('btnLanjut');
            const imgEl = document.getElementById('splashImage');
            const container = document.querySelector('.splash-container');
            
            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.style.cursor = 'not-allowed';
            btn.textContent = 'Lanjutkan (' + countdown + 's)';
            
            imgEl.style.pointerEvents = 'none';
            container.style.pointerEvents = 'none';

            const timer = setInterval(function() {
                countdown--;
                if (countdown > 0) {
                    btn.textContent = 'Lanjutkan (' + countdown + 's)';
                } else {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                    btn.textContent = 'Lanjutkan →';
                    imgEl.style.pointerEvents = 'auto';
                    container.style.pointerEvents = 'auto';
                    console.log('✅ Countdown selesai, tombol aktif!');
                }
            }, 1000);
        }

        // ============================================================
        // 2. FITUR REFERAL - BACA PARAMETER DARI URL
        // ============================================================
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const refEmail = urlParams.get('ref');
            
            if (refEmail && refEmail.includes('@')) {
                sessionStorage.setItem('referral_email', refEmail);
                console.log('🔗 Referal detected:', refEmail);
            } else {
                // Cek apakah ada di sessionStorage dari sebelumnya
                const savedRef = sessionStorage.getItem('referral_email');
                if (!savedRef) {
                    sessionStorage.removeItem('referral_email');
                }
                console.log('🔗 Tidak ada referal baru');
            }
            
            const savedRef = sessionStorage.getItem('referral_email');
            if (savedRef) {
                console.log('📌 Referal tersimpan di session:', savedRef);
            }
        })();

        // ============================================================
        // 3. CEK WAKTU KUNJUNGAN (NON-AKTIF - user harus klik)
        // ============================================================
        function checkLastVisit() {
            return false;
        }

        // ============================================================
        // 4. FUNGSI REDIRECT KE MENU
        // ============================================================
        function goToMenu() {
            window.location.href = TARGET_URL;
        }

        // ============================================================
        // 5. INSTALL APP
        // ============================================================
        let deferredPrompt = null;

        function isAppInstalled() {
            const installed = localStorage.getItem(INSTALL_KEY) === 'true';
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
            const isIOSStandalone = window.navigator.standalone === true;
            return installed || isStandalone || isIOSStandalone;
        }

        function updateInstallBanner() {
            const banner = document.getElementById('installBanner');
            if (isAppInstalled()) {
                banner.classList.remove('show');
                console.log('✅ App sudah terinstall, banner disembunyikan');
            } else {
                banner.classList.add('show');
                console.log('📲 App belum terinstall, banner ditampilkan');
            }
        }

        function handleInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('✅ User menerima install');
                        localStorage.setItem(INSTALL_KEY, 'true');
                        updateInstallBanner();
                    } else {
                        console.log('❌ User menolak install');
                    }
                    deferredPrompt = null;
                });
            } else {
                localStorage.setItem(INSTALL_KEY, 'true');
                updateInstallBanner();
                alert('✅ Aplikasi telah disimpan. Untuk pengalaman terbaik, buka melalui browser dan pilih "Add to Home Screen" atau "Install App".');
            }
        }

        // ============================================================
        // 6. EKSEKUSI UTAMA
        // ============================================================
        const isRedirected = checkLastVisit();
        startImageRotation();
        startCountdown();

        if (!isRedirected) {
            const btnLanjut = document.getElementById('btnLanjut');
            const splashImage = document.getElementById('splashImage');
            const container = document.querySelector('.splash-container');
            const btnInstall = document.getElementById('btnInstall');

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                console.log('📲 beforeinstallprompt terdeteksi');
                updateInstallBanner();
            });

            window.addEventListener('appinstalled', () => {
                localStorage.setItem(INSTALL_KEY, 'true');
                updateInstallBanner();
                console.log('✅ App berhasil diinstall!');
            });

            updateInstallBanner();

            btnInstall.addEventListener('click', function(e) {
                e.stopPropagation();
                handleInstall();
            });

            btnLanjut.addEventListener('click', function(e) {
                e.preventDefault();
                console.log('👆 User klik tombol, redirect ke menu...');
                goToMenu();
            });

            splashImage.addEventListener('click', function() {
                console.log('🖼️ Klik gambar, redirect ke menu...');
                goToMenu();
            });
            splashImage.style.cursor = 'pointer';

            container.addEventListener('click', function(e) {
                if (e.target === btnLanjut || e.target.closest('.btn-lanjut')) return;
                if (e.target === btnInstall || e.target.closest('.btn-install')) return;
                if (e.target.closest('.install-banner')) return;
                
                console.log('📦 Klik container, redirect ke menu...');
                goToMenu();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    console.log('⌨️ Keyboard trigger, redirect ke menu...');
                    goToMenu();
                }
            });

            console.log('✅ Splash siap. User HARUS KLIK untuk masuk ke menu.');
            console.log('📌 Tidak ada auto-redirect!');
        }

        // ============================================================
        // 7. INFO CONSOLE
        // ============================================================
        const lastVisit = localStorage.getItem(STORAGE_KEY);
        if (lastVisit) {
            const date = new Date(parseInt(lastVisit, 10));
            console.log('📅 Terakhir akses menu:', date.toLocaleString());
            const diff = Date.now() - parseInt(lastVisit, 10);
            const hours = Math.floor(diff / (60 * 60 * 1000));
            const minutes = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
            console.log(`⏱️ Selisih: ${hours} jam ${minutes} menit`);
        } else {
            console.log('📅 Belum pernah akses menu sebelumnya');
        }

        console.log('📲 Status Install:', isAppInstalled() ? '✅ Terinstall' : '❌ Belum install');
    </script>

</body>
</html>
