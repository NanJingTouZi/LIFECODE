<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanjing Investment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a1a2b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        .splash-container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .splash-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            margin-bottom: 30px;
        }

        .btn-lanjut {
            background: linear-gradient(135deg, #f5c842, #dba62b);
            border: none;
            border-radius: 50px;
            padding: 16px 60px;
            font-size: 20px;
            font-weight: 700;
            color: #0a1a2b;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 0 #a07a1e, 0 10px 30px rgba(245, 200, 66, 0.3);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-lanjut:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #a07a1e, 0 15px 40px rgba(245, 200, 66, 0.4);
        }

        .btn-lanjut:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #a07a1e;
        }

        .btn-lanjut:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .timer-info {
            color: #7e9bb5;
            font-size: 13px;
            margin-top: 16px;
            opacity: 0.7;
        }

        .timer-info span {
            color: #f5c842;
            font-weight: 600;
        }

        /* ===== INSTALL BANNER ===== */
        .install-banner {
            background: linear-gradient(135deg, #1a2f44, #0d1f30);
            border: 1px solid #f5c842;
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 8px 30px rgba(245, 200, 66, 0.1);
            animation: slideUp 0.5s ease;
        }

        .install-banner.show {
            display: flex;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .install-banner .icon-text {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #e8edf3;
        }

        .install-banner .icon-text .icon {
            font-size: 28px;
            background: #f5c842;
            color: #0a1a2b;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: 700;
        }

        .install-banner .icon-text .text {
            text-align: left;
        }

        .install-banner .icon-text .text strong {
            color: #f5c842;
            display: block;
            font-size: 15px;
        }

        .install-banner .icon-text .text small {
            font-size: 12px;
            color: #7e9bb5;
        }

        .btn-install {
            background: #f5c842;
            border: none;
            border-radius: 30px;
            padding: 10px 28px;
            font-weight: 700;
            font-size: 14px;
            color: #0a1a2b;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(245, 200, 66, 0.3);
            flex-shrink: 0;
        }

        .btn-install:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(245, 200, 66, 0.5);
        }

        .btn-install:active {
            transform: scale(0.95);
        }

        /* Countdown timer di tombol */
        .countdown-badge {
            display: inline-block;
            background: rgba(10, 26, 43, 0.2);
            border-radius: 30px;
            padding: 2px 12px;
            margin-left: 8px;
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .btn-lanjut {
                padding: 14px 40px;
                font-size: 17px;
                width: 100%;
            }

            .install-banner {
                flex-direction: column;
                text-align: center;
                padding: 16px;
            }

            .install-banner .icon-text {
                flex-direction: column;
                text-align: center;
            }

            .install-banner .icon-text .text {
                text-align: center;
            }

            .btn-install {
                width: 100%;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <!-- Gambar Iklan -->
        <img 
            src="nanjing1.jpeg" 
            alt="Nanjing Investment" 
            class="splash-image"
            id="splashImage"
        />

        <!-- Tombol Lanjutkan dengan Countdown -->
        <button class="btn-lanjut" id="btnLanjut">
            Lanjutkan <span class="countdown-badge" id="countdownDisplay">3</span>
        </button>

        <!-- Timer Info -->
        <div class="timer-info">
            ⏱️ Akan muncul kembali jika <span>1 jam</span> tidak mengunjungi aplikasi
        </div>

        <!-- ===== INSTALL BANNER ===== -->
        <div class="install-banner" id="installBanner">
            <div class="icon-text">
                <div class="icon">📲</div>
                <div class="text">
                    <strong>Install Aplikasi Nanjing</strong>
                    <small>Pasang untuk akses lebih cepat &amp; pengalaman terbaik</small>
                </div>
            </div>
            <button class="btn-install" id="btnInstall">Install Sekarang</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. KONFIGURASI
        // ============================================================
        const TARGET_URL = 'https://nanjingtouzi.github.io/LIFECODE/menu.html';
        const ONE_HOUR = 60 * 60 * 1000;
        const STORAGE_KEY = 'nanjing_last_visit_lifecode';
        const INSTALL_KEY = 'nanjing_app_installed';

        // ============================================================
        // 2. CEK WAKTU KUNJUNGAN (SAMA SEPERTI SEBELUMNYA)
        // ============================================================
        function checkLastVisit() {
            const lastVisit = localStorage.getItem(STORAGE_KEY);
            const currentTime = Date.now();

            if (lastVisit) {
                const timeDiff = currentTime - parseInt(lastVisit, 10);
                if (timeDiff < ONE_HOUR) {
                    console.log('⏳ Masih dalam 1 jam, langsung ke menu...');
                    window.location.href = TARGET_URL;
                    return true;
                } else {
                    console.log('⏰ Sudah lebih dari 1 jam, tampilkan splash...');
                    return false;
                }
            } else {
                console.log('🆕 Pertama kali buka, tampilkan splash...');
                return false;
            }
        }

        // ============================================================
        // 3. FUNGSI REDIRECT KE MENU
        // ============================================================
        function goToMenu() {
            const currentTime = Date.now();
            localStorage.setItem(STORAGE_KEY, currentTime.toString());
            console.log('💾 Waktu kunjungan disimpan:', new Date(currentTime).toLocaleString());
            window.location.href = TARGET_URL;
        }

        // ============================================================
        // 4. INSTALL APP (PWA / Web App)
        // ============================================================
        let deferredPrompt = null;

        // Deteksi apakah sudah terinstall (berdasarkan localStorage + standalone mode)
        function isAppInstalled() {
            // Cek localStorage
            const installed = localStorage.getItem(INSTALL_KEY) === 'true';
            // Cek standalone mode (PWA sudah di-install)
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
            // Cek iOS standalone
            const isIOSStandalone = window.navigator.standalone === true;

            return installed || isStandalone || isIOSStandalone;
        }

        // Tampilkan/sembunyikan install banner
        function updateInstallBanner() {
            const banner = document.getElementById('installBanner');
            if (isAppInstalled()) {
                banner.classList.remove('show');
                console.log('✅ App sudah terinstall, banner disembunyikan');
            } else {
                banner.classList.add('show');
                console.log('📲 App belum terinstall, banner ditampilkan');
            }
        }

        // Handle install prompt
        function handleInstall() {
            if (deferredPrompt) {
                // Chrome/Android - tampilkan prompt
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('✅ User menerima install');
                        localStorage.setItem(INSTALL_KEY, 'true');
                        updateInstallBanner();
                    } else {
                        console.log('❌ User menolak install');
                    }
                    deferredPrompt = null;
                });
            } else {
                // Fallback: simpan status install
                localStorage.setItem(INSTALL_KEY, 'true');
                updateInstallBanner();
                alert('✅ Aplikasi telah disimpan. Untuk pengalaman terbaik, buka melalui browser dan pilih "Add to Home Screen" atau "Install App".');
                console.log('📲 Install disimulasikan (fallback)');
            }
        }

        // ============================================================
        // 5. EKSEKUSI UTAMA
        // ============================================================
        const isRedirected = checkLastVisit();

        if (!isRedirected) {
            // ===== Ambil elemen =====
            const btnLanjut = document.getElementById('btnLanjut');
            const countdownDisplay = document.getElementById('countdownDisplay');
            const splashImage = document.getElementById('splashImage');
            const container = document.querySelector('.splash-container');
            const btnInstall = document.getElementById('btnInstall');

            // ===== INSTALL BANNER =====
            // Cek event beforeinstallprompt (PWA)
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                console.log('📲 beforeinstallprompt terdeteksi');
                updateInstallBanner();
            });

            // App installed event
            window.addEventListener('appinstalled', () => {
                localStorage.setItem(INSTALL_KEY, 'true');
                updateInstallBanner();
                console.log('✅ App berhasil diinstall!');
            });

            // Cek status install saat load
            updateInstallBanner();

            // Tombol Install
            btnInstall.addEventListener('click', function(e) {
                e.stopPropagation();
                handleInstall();
            });

            // ===== COUNTDOWN 3 DETIK =====
            let countdown = 3;
            let countdownInterval = null;
            let isRedirecting = false;

            function startCountdown() {
                countdownInterval = setInterval(() => {
                    countdown -= 1;
                    countdownDisplay.textContent = countdown;

                    if (countdown <= 0) {
                        clearInterval(countdownInterval);
                        countdownDisplay.textContent = '🚀';
                        btnLanjut.disabled = true;
                        // Redirect setelah 3 detik
                        if (!isRedirecting) {
                            isRedirecting = true;
                            console.log('⏰ Auto-redirect setelah 3 detik...');
                            goToMenu();
                        }
                    }
                }, 1000);
            }

            // Mulai countdown
            startCountdown();

            // ===== TOMBOL LANJUT =====
            btnLanjut.addEventListener('click', function(e) {
                e.preventDefault();
                if (isRedirecting) return;
                isRedirecting = true;
                clearInterval(countdownInterval);
                console.log('👆 User klik tombol, redirect sekarang...');
                goToMenu();
            });

            // ===== KLIK GAMBAR =====
            splashImage.addEventListener('click', function() {
                if (isRedirecting) return;
                isRedirecting = true;
                clearInterval(countdownInterval);
                console.log('🖼️ Klik gambar, redirect sekarang...');
                goToMenu();
            });
            splashImage.style.cursor = 'pointer';

            // ===== KLIK CONTAINER (kecuali tombol) =====
            container.addEventListener('click', function(e) {
                if (e.target === btnLanjut || e.target.closest('.btn-lanjut')) return;
                if (e.target === btnInstall || e.target.closest('.btn-install')) return;
                if (e.target.closest('.install-banner')) return;
                if (isRedirecting) return;
                isRedirecting = true;
                clearInterval(countdownInterval);
                console.log('📦 Klik container, redirect sekarang...');
                goToMenu();
            });

            // ===== KEYBOARD =====
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (isRedirecting) return;
                    isRedirecting = true;
                    clearInterval(countdownInterval);
                    console.log('⌨️ Keyboard trigger, redirect sekarang...');
                    goToMenu();
                }
            });

            console.log('✅ Splash siap. Auto-redirect dalam 3 detik atau klik untuk masuk ke menu.');
        }

        // ============================================================
        // 6. INFO CONSOLE
        // ============================================================
        const lastVisit = localStorage.getItem(STORAGE_KEY);
        if (lastVisit) {
            const date = new Date(parseInt(lastVisit, 10));
            console.log('📅 Terakhir akses menu:', date.toLocaleString());
            const diff = Date.now() - parseInt(lastVisit, 10);
            const hours = Math.floor(diff / (60 * 60 * 1000));
            const minutes = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
            console.log(`⏱️ Selisih: ${hours} jam ${minutes} menit`);
        } else {
            console.log('📅 Belum pernah akses menu sebelumnya');
        }

        console.log('📲 Status Install:', isAppInstalled() ? '✅ Terinstall' : '❌ Belum install');
    </script>

</body>
</html>
